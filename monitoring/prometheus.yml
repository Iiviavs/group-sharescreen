global:
  scrape_interval: 15s

scrape_configs:
  - job_name: sharescreen
    metrics_path: /metrics
    static_configs:
      # host.docker.internal works out of the box on Docker Desktop
      # (Windows/Mac) when the signaling server runs on the host, e.g. `npm
      # run dev` / `npm run start:signaling`. If the app instead runs as a
      # container on this same compose network, point this at its service
      # name and port instead (e.g. "app:4000").
      - targets: ["host.docker.internal:4000"]
    # If METRICS_TOKEN is set on the signaling server, uncomment and fill in:
    # authorization:
    #   type: Bearer
    #   credentials: "your-metrics-token"
