# Prometheus + Grafana stack for ShareScreen. Points at the signaling
# server's /metrics endpoint (see monitoring/prometheus.yml to adjust the
# target).
#
# `npm start` brings this up automatically and in the background, via
# scripts/start-monitoring.mjs — it waits until the site itself is online
# first (so it never adds to startup time), and if Docker isn't available
# it's skipped silently; the app is never affected either way. You can also
# still run it by hand any time:
#   docker compose -f docker-compose.monitoring.yml up -d
#   Prometheus: http://localhost:9090
#   Grafana:    http://localhost:3002  (login: admin / admin, unless
#               GRAFANA_ADMIN_PASSWORD is set — change it after first login)
#
# The "ShareScreen" dashboard is provisioned automatically under the
# ShareScreen folder in Grafana.

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: sharescreen-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      # Bound to localhost only — Prometheus has no built-in auth, so
      # anyone who could reach this port could read every metric with no
      # login at all. Grafana talks to it over the internal Docker network
      # (http://prometheus:9090) and doesn't need this published at all;
      # this is just for your own debugging from the host, e.g. via an SSH
      # tunnel (`ssh -L 9090:localhost:9090 user@servidor`).
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: sharescreen-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3002:3000"

volumes:
  prometheus-data:
  grafana-data:
