# Prometheus + Grafana stack for ShareScreen. Points at the signaling
# server's /metrics endpoint (see monitoring/prometheus.yml to adjust the
# target).
#
# This is a SEPARATE deployment from the app itself on purpose — a reverse
# proxy / PaaS (Coolify, etc.) can only route a domain to a container it
# actually manages. If this stack were started as a side effect from
# *inside* the app's own container (e.g. via the Docker socket), it'd be an
# invisible sibling container that Coolify never created and can't route
# to — pointing a domain at "port 3002 on the app resource" would find
# nothing listening there, since Grafana isn't part of that container.
#
# Setup in Coolify: create a new resource of type "Docker Compose", point
# it at this file (same repo/branch as the app), deploy it, then add your
# domain to the `grafana` service in Coolify's UI — Coolify's proxy talks
# to it directly over Docker, no host port juggling needed.
#
# Running it by hand instead (e.g. on a plain VPS, no PaaS):
#   docker compose -f docker-compose.monitoring.yml up -d
#   Prometheus: http://localhost:9090 (loopback-only, see below)
#   Grafana:    http://localhost:3002  (login: admin / admin, unless
#               GRAFANA_ADMIN_PASSWORD is set — change it after first login)
#
# Either way, the app's own signaling port (4000, see /metrics) needs to be
# reachable from wherever this Prometheus container runs — published to the
# host is enough for the default host.docker.internal target below.
#
# The "ShareScreen" dashboard is provisioned automatically under the
# ShareScreen folder in Grafana.

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: sharescreen-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      # Bound to localhost only — Prometheus has no built-in auth, so
      # anyone who could reach this port could read every metric with no
      # login at all. Grafana talks to it over the internal Docker network
      # (http://prometheus:9090) and doesn't need this published at all;
      # this is just for your own debugging from the host, e.g. via an SSH
      # tunnel (`ssh -L 9090:localhost:9090 user@servidor`).
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: sharescreen-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3002:3000"

volumes:
  prometheus-data:
  grafana-data:
